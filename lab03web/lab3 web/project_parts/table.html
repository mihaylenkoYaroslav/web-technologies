<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1. Таблиця</title>
  <style>
    body { text-align: center; }

    table {
      margin: 0 auto;               
      border-collapse: collapse;    
    }

    td {
      width: 50px;
      height: 50px;
      border: 2px solid black;      
    }

    .cyan   { background: #3fffd4; }
    .cream  { background: #fffcd0; }
    .red    { background: #ff1a2d; }
    .blue   { background: #2040ff; }
    .green  { background: #33ff44; }
    .yellow { background: #ffff44; }
  </style>
</head>
<body>
<table>
    <tr>
        <td class="cyan" colspan="8"></td>
    </tr>

        <td class="cream" rowspan="6"></td>
        <td class="cyan" colspan="6"></td>
        <td class="cream" rowspan="6"></td>
    </tr>

    <tr>
        <td class="cream" rowspan="4"></td>
        <td class="cyan" colspan="4"></td>
        <td class="cream" rowspan="4"></td>
    </tr>

    <tr>
        <td class="cream" rowspan="2"></td>
        <td class="red" ></td>
        <td class="blue"></td>
        <td class="cream" rowspan="2"></td>
    </tr>

    <tr>
    <td class="green"></td>
    <td class="yellow"></td>
</tr>


<tr>
    <td class="cyan" colspan="4"></td>
</tr>


<tr>
    <td class="cyan" colspan="6"></td>
</tr>


<tr>
    <td class="cyan" colspan="8"></td>
</tr>
</table>
<p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
