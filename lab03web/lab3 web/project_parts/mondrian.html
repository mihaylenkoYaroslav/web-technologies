<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 2. Мондріан</title>
  <style>
    body { text-align: center; }

    table {
      margin: 0 auto;
      border-collapse: collapse;
    }

    td {
      width: 60px;
      height: 60px;
      border: 5px solid #000000;
    }

    .red    { background: #ff5b2d; }
    .blue   { background: #074481; }
    .yellow { background: #fffa69; }
    .black  { background: #000000; }
    .white  { background: #ffffff; }
  </style>
</head>
<body>
<table>
    <tr>
        <td class="white" colspan="2"></td>
        <td class="white" colspan="2"></td>
        <td class="yellow" colspan="2"></td>
    </tr>
    <tr>
        <td class="white"></td>
        <td class="red" colspan="3" rowspan="2"></td>
        <td class="yellow" colspan="2"></td>
    </tr>
    <tr>
        <td class="white" rowspan="2"></td>
        <td class="white"></td>
        <td class="white"></td>
    </tr>
    <tr>
        <td class="black" colspan="2" rowspan="2"></td>
        <td class="white"></td>
        <td class="white" colspan="2"></td>
    </tr>
    <tr>
        <td class="yellow" rowspan="3"></td>
        <td class="white"></td>
        <td class="blue" colspan="2" rowspan="2"></td>
    </tr>
    <tr>
        <td class="white" colspan="2" rowspan="2"></td>
        <td class="black"></td>
    </tr>
    <tr>
        <td class="white" colspan="3"></td>
    </tr>
</table>

<p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
