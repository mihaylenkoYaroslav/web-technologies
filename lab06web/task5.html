<!DOCTYPE html>
<html lang="uk">
    <head>
        <title>Завдання 5</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="style5.css">
    </head>
    <body>
        <div class="scene">
            <div class="card"></div>

            <span class="material-icons cloud">cloud</span>

            <div class="now">17</div>

            <ul class="forecast">
                <li class="forecast-item"><span class="day">Mon</span><span class="temp">17°</span></li>
                <li class="forecast-item"><span class="day">Tue</span><span class="temp">19°</span></li>
                <li class="forecast-item"><span class="day">Wed</span><span class="temp">16°</span></li>
                <li class="forecast-item"><span class="day">Thu</span><span class="temp">18°</span></li>
                <li class="forecast-item"><span class="day">Fri</span><span class="temp">21°</span></li>
            </ul>

            <div class="arrows">
                <a class="arrow" href="#"><span class="material-icons">arrow_back</span></a>
                <a class="arrow" href="#"><span class="material-icons">arrow_forward</span></a>
            </div>
        </div>
    </body>
</html>
